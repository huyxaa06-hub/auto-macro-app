name: CI Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip lzip libltdl-dev libffi-dev libssl-dev \
            python3-pip python3-setuptools python3-dev \
            build-essential ccache autoconf libtool pkg-config zlib1g-dev \
            openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade Cython==0.29.36 buildozer

      - name: Force compatible Android NDK
        run: |
          # Xóa NDK mặc định gây lỗi và tải bản NDK r25b tương thích tuyệt đối với python-for-android
          rm -rf /usr/local/lib/android/sdk/ndk/*
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip -d /usr/local/lib/android/sdk/ndk/
          mv /usr/local/lib/android/sdk/ndk/android-ndk-r25b /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Build with Buildozer
        run: |
          buildozer -v android debug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
